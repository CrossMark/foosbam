name: Tests and coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with branch coverage
        run: python -m coverage run --branch --source=foosbam,config,app -m unittest discover -s tests

      - name: Enforce complete coverage
        run: python -m coverage report --fail-under=100

      - name: Export coverage report
        run: python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: true
